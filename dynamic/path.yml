http:
  routers:
    user-api:
      rule: "Host(`localhost`) && PathPrefix(`/api/user`)" 
      entryPoints:
        - web
      service: user-service

    device-api:
      rule: "Host(`localhost`) && PathPrefix(`/api/device`)" 
      entryPoints:
        - web
      service: device-service

    authentication-api:
      rule: "Host(`localhost`) && PathPrefix(`/api/auth`)" 
      entryPoints:
        - web
      service: authentication-service

  services:
    user-service:
      loadBalancer:
        servers:
          - url: "http://user_service:8081" 

    device-service:
      loadBalancer:
        servers:
          - url: "http://device_service:8082"

    authentication-service:
      loadBalancer:
        servers:
          - url: "http://authentication_service:8083"
