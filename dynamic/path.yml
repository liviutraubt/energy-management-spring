http:
  middlewares:
    auth-fw:
      forwardAuth:
        address: "http://authenticationservice:8083/validate"
        trustForwardHeader: true
        authRequestHeaders:
         - "app-auth"
  
  routers:
    user-api:
      rule: "Host(`localhost`) && PathPrefix(`/api/user`)"
      entryPoints:
        - web
      service: user-service
      middlewares:
        - auth-fw
      
    device-api:
        rule: "Host(`localhost`) && PathPrefix(`/api/device`)"
        entryPoints:
          - web 
        service: device-service
        middlewares:
          - auth-fw
        
    authentication-api:
        rule: "Host(`localhost`) && PathPrefix(`/api/auth`)"
        entryPoints:
          - web
        service: authentication-service

  services:
    user-service:
      loadBalancer:
        servers:
          - url: "http://userservice:8081" 

    device-service:
      loadBalancer:
        servers:
          - url: "http://deviceservice:8082" 
      
    authentication-service:
      loadBalancer:
        servers:
          - url: "http://authenticationservice:8083" 