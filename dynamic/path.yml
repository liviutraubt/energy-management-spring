http:
  routers:
    user-api:
      rule: "Host(`localhost`) && PathPrefix(`/api/user`)" 
      entryPoints:
        - web
      service: user-service
      middlewares:
        - auth-guard

    device-api:
      rule: "Host(`localhost`) && PathPrefix(`/api/device`)" 
      entryPoints:
        - web
      service: device-service
      middlewares:
        - auth-guard

    authentication-api:
      rule: "Host(`localhost`) && PathPrefix(`/api/auth`)" 
      entryPoints:
        - web
      service: authentication-service

  middlewares:
    auth-guard:
      forwardAuth:
        address: "http://authentication_service:8083/api/auth/validate"
        trustForwardHeader: true
        authRequestHeaders:
          - app-auth


  services:
    user-service:
      loadBalancer:
        servers:
          - url: "http://user_service:8081" 

    device-service:
      loadBalancer:
        servers:
          - url: "http://device_service:8082"

    authentication-service:
      loadBalancer:
        servers:
          - url: "http://authentication_service:8083"
